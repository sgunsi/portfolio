name: Update currently reading

on:
  schedule:
    - cron: "17 13 * * *"   # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_reading.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/reading.json)" ]; then
            git config user.name "reading-bot"
            git config user.email "reading-bot@users.noreply.github.com"
            git add data/reading.json
            git commit -m "Update currently reading"
            git push
          fi
