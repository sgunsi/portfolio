<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2B2BFF;--bg:#ffffff;--text:#0a0a0a;--muted:#888;--border:rgba(0,0,0,0.07);--card:#fff}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}



/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 48px;background:rgba(255,255,255,0.92);backdrop-filter:blur(14px)}
.nav-logo{font-weight:500;font-size:15px;text-decoration:none;color:var(--text)}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{font-size:14px;text-decoration:none;color:var(--muted);transition:color 0.2s}
.nav-links a:hover{color:var(--text)}
.nav-resume{color:var(--blue)!important;font-weight:500}
.burger-btn{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
.burger-btn span{display:block;width:22px;height:1px;background:var(--text)}
.mobile-menu{display:none;position:fixed;top:58px;left:0;right:0;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);padding:24px 32px;z-index:99;flex-direction:column;gap:20px}
.mobile-menu.open{display:flex}
.mobile-menu a{font-size:18px;text-decoration:none;color:var(--text);font-weight:500}

/* HERO */
.hero{padding-top:64px;position:relative;z-index:1}

.hero-image{
  width:100%;
  height:60vh;
  overflow:hidden;
  background:#e8e8e6;
  position:relative;
}
.hero-image img{width:100%;height:100%;object-fit:cover;display:block}
.hero-image-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;
  background:linear-gradient(135deg,#e8e8ff 0%,#f0f0f8 100%);
}
.hero-image-placeholder p{font-size:13px;color:var(--muted);font-style:italic}

.hero-meta{padding:0 56px;position:relative;z-index:1;max-width:1200px;margin:0 auto}

.meta-strip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  border-bottom:1px solid var(--border);
  padding:32px 0;
}
.meta-item{padding:0 24px;border-right:1px solid var(--border)}
.meta-item:first-child{padding-left:0}
.meta-item:last-child{border-right:none}
.meta-label{font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--muted);margin-bottom:10px}
.meta-value{font-size:14px;font-weight:500;color:var(--text);line-height:1.5}

.hero-eyebrow{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue);margin-bottom:12px;margin-top:40px}
.hero-title{font-family:'Fraunces',serif;font-size:clamp(36px,5vw,64px);font-weight:400;line-height:1.1;letter-spacing:-0.01em;color:var(--text);margin-bottom:16px}
.hero-title em{font-style:italic}
.hero-desc{font-size:16px;color:var(--muted);line-height:1.75;max-width:560px;padding-bottom:48px}

/* DIVIDER */
.divider{height:1px;background:var(--border);max-width:calc(1200px - 112px);margin:48px auto 0}

/* CONTENT SECTIONS */
.content{padding:64px 56px;position:relative;z-index:1;max-width:1200px;margin:0 auto}

/* section header consistent label style */
.section-label{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}

/* body text */
.body-text{font-size:16px;color:var(--muted);line-height:1.85;max-width:680px}
.body-text strong{color:var(--text);font-weight:600}
.body-text p+p{margin-top:16px}

/* section title */
.section-title{font-family:'Fraunces',serif;font-size:clamp(28px,3.5vw,44px);font-weight:400;font-style:italic;color:var(--text);line-height:1.15;margin-bottom:20px}

/* two col layout */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px}

/* image placeholder */
.img-placeholder{
  width:100%;
  background:#efefed;
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
  color:var(--muted);
  font-size:13px;
  font-style:italic;
  border:1px dashed rgba(0,0,0,0.12);
}
.img-placeholder.tall{aspect-ratio:4/3}
.img-placeholder.wide{aspect-ratio:16/9}
.img-placeholder.square{aspect-ratio:1}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px}
.stat-number{font-family:'Fraunces',serif;font-size:clamp(36px,4vw,52px);font-weight:400;color:var(--blue);line-height:1;margin-bottom:6px}
.stat-label{font-size:13px;color:var(--muted);line-height:1.5}

/* highlight card */
.highlight{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:28px 32px;margin-top:8px;transition:box-shadow 0.25s,transform 0.25s,border-color 0.25s}
.highlight:hover{box-shadow:0 12px 36px rgba(0,0,0,0.08);transform:translateY(-3px);border-color:rgba(0,0,0,0.15)}
.highlight-tag{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.highlight-title{font-family:'Fraunces',serif;font-size:clamp(20px,2.5vw,28px);font-weight:400;font-style:italic;color:var(--text);margin-bottom:12px;line-height:1.2}
.highlight-body{font-size:14px;color:var(--muted);line-height:1.75}
.highlight-body strong{color:var(--text);font-weight:600}

/* role chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{font-size:12px;font-weight:500;padding:5px 14px;border-radius:6px;background:rgba(43,43,255,0.09);color:#3535d6}
.chip-muted{background:rgba(43,43,255,0.09);color:#3535d6}

/* back link */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;transition:color 0.2s;margin-bottom:32px}
.back:hover{color:var(--text)}

/* FOOTER */
footer{padding:64px 56px;border-top:1px solid var(--border);position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;margin-top:80px;max-width:1200px;margin-left:auto;margin-right:auto}
.footer-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.footer-email{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(18px,2.5vw,28px);font-weight:400;color:var(--text);text-decoration:none;transition:color 0.2s}
.footer-email:hover{color:var(--blue)}
.footer-right{text-align:right}
.footer-note{font-size:13px;color:var(--muted);margin-bottom:12px}
.footer-social{display:flex;gap:16px;justify-content:flex-end}
.footer-social a{font-size:13px;color:var(--blue);text-decoration:none;font-weight:500}
.footer-social a:hover{text-decoration:underline}

/* next case study */
.next-case{padding:0 56px 80px;position:relative;z-index:1;max-width:1200px;margin:0 auto}
.next-label{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.next-card{display:grid;grid-template-columns:1fr 1.4fr;gap:48px;align-items:center;padding:40px;background:var(--card);border:1px solid var(--border);border-radius:4px;text-decoration:none;color:inherit;transition:box-shadow 0.25s,transform 0.25s}
.next-card:hover{box-shadow:0 16px 48px rgba(0,0,0,0.08);transform:translateY(-3px)}
.next-card-eyebrow{font-size:11px;font-weight:500;color:var(--blue);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px}
.next-card-title{font-family:'Fraunces',serif;font-size:clamp(22px,2.5vw,32px);font-weight:400;font-style:italic;color:var(--text);line-height:1.2;margin-bottom:12px}
.next-card-cta{font-size:13px;font-weight:500;color:var(--blue)}
.next-card img{width:100%;border-radius:10px;aspect-ratio:16/9;object-fit:cover}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){
  .two-col,.three-col,.stats{grid-template-columns:1fr}
  .meta-strip{grid-template-columns:1fr 1fr}
  .meta-item{border-right:none;border-bottom:1px solid var(--border);padding:16px 0}
  .next-card{grid-template-columns:1fr}
}
@media(max-width:768px){
  nav{padding:16px 20px}.nav-links{display:none}.burger-btn{display:flex}
  .hero-meta,.content,.divider,.next-case{padding-left:24px;padding-right:24px}
  .hero-image{height:40vh}
  .meta-strip{grid-template-columns:1fr}
  footer{padding:48px 24px;flex-direction:column;gap:24px;align-items:flex-start}
  .footer-right{text-align:left}.footer-social{justify-content:flex-start}
}
/* PASSWORD GATE */
#password-gate{position:fixed;top:0;left:0;width:100%;height:100%;background:#ffffff;z-index:9999;display:flex;align-items:center;justify-content:center}
#password-gate .gate-inner{text-align:center;max-width:420px;padding:0 24px}
#password-gate .gate-headline{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,42px);font-weight:300;font-style:italic;color:var(--text);margin-bottom:16px;line-height:1.2}
#password-gate .gate-sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:32px}
#password-gate .gate-input{width:100%;padding:12px 16px;font-family:'Inter',sans-serif;font-size:15px;border:1px solid var(--border);border-radius:8px;outline:none;transition:border-color 0.2s}
#password-gate .gate-input:focus{border-color:#2B2BFF}
#password-gate .gate-btn{display:inline-block;margin-top:16px;padding:12px 40px;background:#2B2BFF;color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;border:none;border-radius:8px;cursor:pointer;transition:opacity 0.2s}
#password-gate .gate-btn:hover{opacity:0.88}
#password-gate .gate-error{font-size:13px;color:#cc2222;margin-top:12px;min-height:20px}
@keyframes gate-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.gate-shake{animation:gate-shake 0.4s ease}
</style>

  async function open(p){

  var saved=null; try{saved=sessionStorage.getItem(KEY);}catch(e){}
  if(saved){ open(saved).then(function(h){show(h,saved);}).catch(function(){}); }
  form.addEventListener('submit',function(e){
